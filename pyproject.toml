[project]
name = "agentic-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "colorlog>=6.9.0",
    "langfuse>=2.0.0",
    "python-dotenv>=1.0.0",
    "effgen[gguf]",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]
