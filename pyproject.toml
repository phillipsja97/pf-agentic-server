[project]
name = "agentic-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "colorlog>=6.9.0",
    "langfuse>=2.0.0",
    "python-dotenv>=1.0.0",
    "effgen",
    "python-jose[cryptography]>=3.5.0",
    "email-validator>=2.3.0",
    "bcrypt>=5.0.0",
    "duckdb>=1.5.4",
    "deltalake>=1.6.2",
    "polars>=1.42.1",
    "openai>=2.41.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.1.1",
]
